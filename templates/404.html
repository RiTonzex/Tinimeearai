{% extends 'base.html' %}

{% block title %}ไม่พบหน้าที่คุณต้องการ (404 Not Found) - ที่นี่มีอะไร{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4 py-8">
    <div class="relative mb-6">
        <div class="w-24 h-24 rounded-3xl bg-slate-900/90 border border-slate-800 flex items-center justify-center shadow-2xl shadow-emerald-500/10">
            <i data-lucide="map-pin-off" class="w-12 h-12 text-emerald-400"></i>
        </div>
        <span class="absolute -top-2 -right-2 px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30 text-xs font-mono font-bold">
            404
        </span>
    </div>

    <h1 class="text-2xl md:text-3xl font-extrabold text-white mb-2 tracking-tight">
        ไม่พบหน้าที่คุณกำลังค้นหา
    </h1>
    
    <p class="text-sm text-slate-400 max-w-sm mb-8 leading-relaxed">
        พิกัดหรือหน้าที่คุณเรียกหาอาจถูกย้าย ลบ หรือระบุ URL ไม่ถูกต้อง
    </p>

    <div class="flex items-center gap-3">
        <a href="{% url 'post_list' %}" class="inline-flex items-center gap-2 px-5 py-3 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-400 hover:from-emerald-300 hover:to-teal-300 text-slate-950 font-bold text-xs shadow-xl shadow-emerald-500/25 active:scale-95 transition">
            <i data-lucide="compass" class="w-4 h-4"></i>
            <span>กลับสู่หน้าแรก</span>
        </a>
        <a href="javascript:history.back()" class="inline-flex items-center gap-2 px-4 py-3 rounded-2xl bg-slate-900/80 hover:bg-slate-800 text-slate-300 border border-slate-700/80 text-xs font-bold active:scale-95 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>ย้อนกลับ</span>
        </a>
    </div>
</div>
{% endblock %}
