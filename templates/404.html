{% extends 'base.html' %}

{% block title %}ไม่พบหน้าที่คุณต้องการ (404 Not Found) - ที่นี่มีอะไร{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4 py-8">
    <div class="relative mb-6">
        <div class="w-24 h-24 rounded-3xl bg-zinc-900 border border-zinc-800 flex items-center justify-center shadow-2xl">
            <i data-lucide="map-pin-off" class="w-12 h-12 text-zinc-400"></i>
        </div>
        <span class="absolute -top-2 -right-2 px-2.5 py-0.5 rounded-full bg-zinc-800 text-zinc-300 border border-zinc-700 text-xs font-mono font-bold">
            404
        </span>
    </div>

    <h1 class="text-2xl md:text-3xl font-extrabold text-white mb-2 tracking-tight">
        ไม่พบหน้าที่คุณกำลังค้นหา
    </h1>
    
    <p class="text-sm text-zinc-400 max-w-sm mb-8 leading-relaxed">
        พิกัดหรือหน้าที่คุณเรียกหาอาจถูกย้าย ลบ หรือระบุ URL ไม่ถูกต้อง
    </p>

    <div class="flex items-center gap-3">
        <a href="{% url 'post_list' %}" class="inline-flex items-center gap-2 px-5 py-3 rounded-2xl bg-white hover:bg-zinc-200 text-black font-bold text-xs shadow-xl shadow-white/10 active:scale-95 transition">
            <i data-lucide="compass" class="w-4 h-4"></i>
            <span>กลับสู่หน้าแรก</span>
        </a>
        <a href="javascript:history.back()" class="inline-flex items-center gap-2 px-4 py-3 rounded-2xl bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 text-xs font-bold active:scale-95 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>ย้อนกลับ</span>
        </a>
    </div>
</div>
{% endblock %}
