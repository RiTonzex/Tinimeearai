{% extends 'base.html' %}

{% block title %}เข้าสู่ระบบ - ที่นี่มีอะไร{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="p-7 md:p-9 rounded-[2.25rem] glass-card border border-white/[0.08] shadow-2xl space-y-6 relative overflow-hidden">
        <div class="text-center space-y-2 relative z-10">
            <div class="w-14 h-14 rounded-2xl bg-zinc-850 border border-zinc-700 flex items-center justify-center text-white mx-auto shadow-xl">
                <i data-lucide="log-in" class="w-7 h-7"></i>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">เข้าสู่ระบบ</h1>
            <p class="text-xs text-zinc-400">ยินดีต้อนรับสู่คอมมูนิตี้ท่องเที่ยว "ที่นี่มีอะไร"</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <div class="space-y-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300">ชื่อผู้ใช้งาน หรือ อีเมล (Username / Email)</label>
                <input type="text" name="username" required autofocus class="w-full px-4 py-3.5 rounded-2xl bg-zinc-900 border border-zinc-800 text-white placeholder-zinc-500 focus:ring-2 focus:ring-white/30 focus:border-zinc-700 outline-none text-sm transition shadow-inner font-medium" placeholder="ระบุชื่อผู้ใช้งาน หรือ อีเมลของคุณ">
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300">รหัสผ่าน (Password)</label>
                <input type="password" name="password" required class="w-full px-4 py-3.5 rounded-2xl bg-zinc-900 border border-zinc-800 text-white placeholder-zinc-500 focus:ring-2 focus:ring-white/30 focus:border-zinc-700 outline-none text-sm transition shadow-inner font-medium" placeholder="ระบุรหัสผ่าน">
            </div>

            <button type="submit" class="w-full py-4 px-4 rounded-2xl bg-white hover:bg-zinc-200 text-black font-black text-sm shadow-xl shadow-white/10 active:scale-[0.98] transition">
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- Google OAuth 2.0 Sign-In -->
        <div class="space-y-3 pt-1">
            <div class="relative flex items-center justify-center">
                <div class="border-t border-zinc-800 w-full"></div>
                <span class="bg-black px-3 text-[10px] text-zinc-500 uppercase tracking-widest font-mono shrink-0">หรือ</span>
            </div>

            <a href="{% url 'google_login' %}" class="w-full py-3.5 px-4 rounded-2xl bg-zinc-900 hover:bg-zinc-850 text-white font-bold text-xs border border-zinc-800 hover:border-zinc-700 shadow-lg flex items-center justify-center gap-3 transition active:scale-[0.98]">
                <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                    <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                    <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.1s.7 5.4 1.9 7.8l3.7-2.9z"/>
                    <path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16.5C3.7 20.2 7.5 23.5 12 23.5z"/>
                </svg>
                <span>เข้าสู่ระบบด้วย Google</span>
            </a>
        </div>

        <div class="text-center pt-2 border-t border-zinc-800">
            <p class="text-xs text-zinc-400">
                ยังไม่มีบัญชีผู้ใช้? 
                <a href="{% url 'register' %}" class="text-white font-bold hover:underline">สมัครสมาชิกใหม่</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
