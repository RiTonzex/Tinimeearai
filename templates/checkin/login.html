{% extends 'base.html' %}

{% block title %}เข้าสู่ระบบ - ที่นี่มีอะไร{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="p-7 md:p-9 rounded-[2.25rem] glass-card border border-white/[0.08] shadow-2xl space-y-6 relative overflow-hidden">
        <div class="absolute -right-8 -top-8 w-36 h-36 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="text-center space-y-2 relative z-10">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-400 to-teal-400 flex items-center justify-center text-slate-950 mx-auto shadow-xl shadow-emerald-500/20">
                <i data-lucide="log-in" class="w-7 h-7"></i>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">เข้าสู่ระบบ</h1>
            <p class="text-xs text-slate-400">ยินดีต้อนรับสู่คอมมูนิตี้ท่องเที่ยว "ที่นี่มีอะไร"</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="space-y-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" name="username" required autofocus class="w-full px-4 py-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 text-white placeholder-slate-500 focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none text-sm transition shadow-inner" placeholder="ระบุชื่อผู้ใช้งาน">
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">รหัสผ่าน (Password)</label>
                <input type="password" name="password" required class="w-full px-4 py-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 text-white placeholder-slate-500 focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none text-sm transition shadow-inner" placeholder="ระบุรหัสผ่าน">
            </div>

            <button type="submit" class="w-full py-4 px-4 rounded-2xl bg-gradient-to-r from-emerald-400 via-teal-400 to-emerald-500 hover:from-emerald-300 hover:to-teal-300 text-slate-950 font-black text-sm shadow-xl shadow-emerald-500/25 active:scale-[0.98] transition">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-800/80">
            <p class="text-xs text-slate-400">
                ยังไม่มีบัญชีผู้ใช้? 
                <a href="{% url 'register' %}" class="text-emerald-400 font-bold hover:underline">สมัครสมาชิกใหม่</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
